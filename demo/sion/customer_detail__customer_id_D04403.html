



<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>顧客詳細情報 - SMART WATER</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * { box-sizing: border-box; }
        body{
          margin:0;
          font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", Arial, sans-serif;
          background:#f5f6f8;
          color:#111827;
        }

        /* ===============================
           ✅ TOP NAVBAR (통일본)
           =============================== */
        .navbar{
          height:56px;
          background:#243646;
          display:flex;
          align-items:center;
          padding:0 22px;
          gap:26px;
          position:relative;
          flex-wrap: nowrap;
        }

        .navbar-brand{
          font-weight:800;
          font-size:16px;
          color:#2aa3ff;
          text-decoration:none;
          white-space:nowrap;

          display:inline-flex;
          align-items:center;
          gap:8px;
          flex:0 0 auto;
        }

        .nav-links{
          list-style:none;
          display:flex;
          align-items: stretch;
          gap:22px;
          margin:0;
          padding:0;
          position:relative;

          flex-wrap: nowrap;
          white-space: nowrap;
          min-width: 0;
          overflow-x: auto;
          overflow-y: hidden;
          scrollbar-width: none;
        }
        .nav-links::-webkit-scrollbar { display:none; }

        .nav-links li{
          display:flex;
          align-items:center;
          flex:0 0 auto;
        }

        .nav-links a{
          color:#cbd5e1;
          text-decoration:none;
          font-size:13px;
          font-weight:600;
          white-space:nowrap;
          position:relative;

          height:56px;
          display:flex;
          align-items:center;
          padding:0 4px;
          line-height:1;
        }

        .nav-links a:hover{ color:#ffffff; }

        /* ✅ 현재 페이지 밑줄(통일 규칙) */
        .nav-links a.is-active::after{
          content:"";
          position:absolute;
          left:0;
          bottom:10px;
          width:100%;
          height:2px;
          background:#2aa3ff;
          border-radius:2px;
        }

        /* ===============================
           ✅ ADMIN (통일본 + dropdown)
           =============================== */
        .admin-area{
          margin-left:auto;
          position:relative;
          display:flex;
          align-items:center;
          gap:10px;
          flex:0 0 auto;
        }

        .admin-text{
          display:flex;
          flex-direction:column;
          align-items:flex-end;
          line-height:1.2;
          margin:0;
          transform:none;
          white-space:nowrap;
        }

        .admin-name{
          font-size:12px;
          font-weight:700;
          color:#e5edf5;
        }

        .admin-id{
          font-size:11px;
          color:#9fb0c3;
        }

        .admin-icon{
          width:30px;
          height:30px;
          border-radius:50%;
          background:rgba(255,255,255,.92);
          display:flex;
          align-items:center;
          justify-content:center;
          box-shadow:0 0 0 2px rgba(255,255,255,.28);
          user-select:none;
          cursor:pointer;
        }

        .admin-icon svg{ width:18px; height:18px; opacity:.85; }

        .admin-dropdown{
          position:absolute;
          top:100%;
          right:0;
          margin-top:6px;
          min-width:120px;
          background:rgba(255,255,255,.72);
          backdrop-filter: blur(10px);
          -webkit-backdrop-filter: blur(10px);
          border:1px solid rgba(229,231,235,.9);
          border-radius:12px;
          box-shadow:0 16px 36px rgba(0,0,0,.18);
          display:flex;
          flex-direction:column;
          overflow:hidden;
          z-index:1000;

          opacity:0;
          visibility:hidden;
          pointer-events:none;
          transform: translateY(6px);
          transition: opacity .16s ease, transform .16s ease, visibility .16s;
        }

        .admin-dropdown.open{
          opacity:1;
          visibility:visible;
          pointer-events:auto;
          transform: translateY(0);
        }

        .admin-area:hover .admin-dropdown{
          opacity:1;
          visibility:visible;
          pointer-events:auto;
          transform: translateY(0);
        }

        .dropdown-item{
          padding:9px 12px;
          font-size:13px;
          color:#111827;
          text-decoration:none;
          white-space:nowrap;
        }

        .dropdown-item:hover{ background: rgba(17,24,39,.06); }

        .dropdown-sep{
          height:1px;
          background: rgba(17,24,39,.08);
          margin:2px 0;
        }

        .dropdown-item.logout{
          color:#b91c1c;
          font-weight:800;
        }

        /* ===============================
           ✅ PAGE CONTENT (상세페이지 전용 스타일)
           =============================== */
        .main-container { max-width: 850px; margin: 40px auto; padding: 0 20px; }
        .content-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }

        .detail-header { border-bottom: 2px solid #2aa3ff; padding-bottom: 15px; margin-bottom: 30px; }
        .detail-header h2 { margin: 0; color: #2c3e50; font-size: 24px; }

        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .info-item { padding: 18px; background: #fafafa; border: 1px solid #eee; border-radius: 8px; }
        .info-label { font-size: 13px; color: #7f8c8d; margin-bottom: 8px; font-weight: 800; }
        .info-value { font-size: 19px; font-weight: 900; color: #2c3e50; }

        .btn-group { margin-top: 40px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
        .btn-back { padding: 12px 25px; background: #95a5a6; color: white; text-decoration: none; border-radius: 8px; font-size: 14px; font-weight: 900; }
        .btn-primary { padding: 12px 25px; background: #2aa3ff; color: white; text-decoration: none; border-radius: 8px; font-size: 14px; font-weight: 900; }
    </style>
</head>
<body>

    <!-- ✅ 통일 메뉴바 적용 -->
    <nav class="navbar">
      <a href="main.html" class="navbar-brand">💧 SMART WATER JP</a>

      <ul class="nav-links" id="navLinks">
        <!-- 이 페이지는 '상세'지만, 상위 메뉴는 보통 '顧客一覧'를 활성 처리 -->
        <li><a href="customer_list.html" class="is-active">顧客一覧</a></li>
        <li><a href="district.html">管轄区域管理</a></li>
        <li><a href="overdue_list.html">延滞管理</a></li>
        <li><a href="#">入金管理</a></li>
        <li><a href="billing_list.html">請求管理</a></li>
      </ul>

      <div class="admin-area" id="adminArea">
        <div class="admin-text">
          <div class="admin-name">管理者 デモ 様</div>
          <div class="admin-id">社員番号 A1001</div>
        </div>

        <div class="admin-icon">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 12c2.76 0 5-2.46 5-5.5S14.76 1 12 1 7 3.46 7 6.5 9.24 12 12 12Z"
                  stroke="#111827" stroke-width="1.6"/>
            <path d="M3 23c0-4.2 4-7.6 9-7.6s9 3.4 9 7.6"
                  stroke="#111827" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </div>

        <div class="admin-dropdown" id="adminDropdown">
          <a href="admin.html" class="dropdown-item">設定</a>
          <div class="dropdown-sep"></div>
          <a href="index.html" class="dropdown-item logout">ログアウト</a>
        </div>
      </div>
    </nav>

    <div class="main-container">
        <div class="content-card">
            <div class="detail-header">
                <h2>顧客詳細情報</h2>
            </div>

            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">顧客名</div>
                    <div class="info-value">高橋 拓海 様</div>
                </div>

                <div class="info-item">
                    <div class="info-label">電話番号</div>
                    <div class="info-value">090-4400-0403</div>
                </div>

                <div class="info-item" style="grid-column: span 2;">
                    <div class="info-label">設置場所住所</div>
                    <div class="info-value">東京都港区六本木3-2-5</div>
                </div>

                <div class="info-item">
                    <div class="info-label">未払金額</div>
                    <div class="info-value">¥24,300</div>
                </div>

                <div class="info-item">
                    <div class="info-label">滞納期間</div>
                    <div class="info-value">5 ヶ月</div>
                </div>
            </div>

            <div class="btn-group">
                <a href="customer_list.html" class="btn-back">← 顧客一覧へ戻る</a>
                <a href="billing__customer_id_D04403.html" class="btn-primary">請求書を表示</a>
            </div>
        </div>
    </div>

    <script>
      // ✅ ADMIN DROPDOWN (click to toggle)
      (function () {
        const adminArea = document.getElementById("adminArea");
        const adminDropdown = document.getElementById("adminDropdown");
        if (!adminArea || !adminDropdown) return;

        adminArea.addEventListener("click", function (e) {
          e.stopPropagation();
          adminDropdown.classList.toggle("open");
        });

        adminDropdown.addEventListener("click", function (e) {
          e.stopPropagation();
        });

        document.addEventListener("click", function () {
          adminDropdown.classList.remove("open");
        });
      })();
    </script>

</html>
