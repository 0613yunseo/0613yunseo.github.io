



<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SMART WATER JP - 設定</title>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", Arial, sans-serif;
      background: #f5f6f8;
      color: #111827;
    }

    /* ===============================
       ✅ TOP NAVBAR (main.jsp와 동일)
       =============================== */
    .navbar {
      height: 56px;
      background: #243646;
      display: flex;
      align-items: center;
      padding: 0 22px;
      gap: 26px;
      position: relative;
      flex-wrap: nowrap;
    }

    .navbar-brand {
      font-weight: 800;
      font-size: 16px;
      color: #2aa3ff;
      text-decoration: none;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .nav-links {
      list-style: none;
      display: flex;
      align-items: stretch;
      gap: 22px;
      margin: 0;
      padding: 0;
      position: relative;
      flex-wrap: nowrap;
      white-space: nowrap;
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
    }
    .nav-links::-webkit-scrollbar { display: none; }

    .nav-links li{
      display: flex;
      align-items: center;
      flex: 0 0 auto;
    }

    .nav-links a {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      position: relative;
      height: 56px;
      display: flex;
      align-items: center;
      padding: 0 4px;
      line-height: 1;
    }

    .nav-links a:hover { color: #ffffff; }

    /* ===============================
       ✅ ADMIN (main.jsp와 동일)
       =============================== */
    .admin-area{
      margin-left: auto;
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }

    .admin-text{
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      line-height: 1.2;
      margin: 0;
      transform: none;
      white-space: nowrap;
    }

    .admin-name {
      font-size: 12px;
      font-weight: 700;
      color: #e5edf5;
    }

    .admin-id {
      font-size: 11px;
      color: #9fb0c3;
    }

    .admin-icon {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255,255,255,.92);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 0 2px rgba(255,255,255,.28);
      user-select: none;
      cursor: pointer;
    }

    .admin-icon svg { width: 18px; height: 18px; opacity: .85; }

    .admin-dropdown {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 6px;
      min-width: 120px;
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(229,231,235,.9);
      border-radius: 12px;
      box-shadow: 0 16px 36px rgba(0,0,0,.18);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(6px);
      transition: opacity .16s ease, transform .16s ease, visibility .16s;
    }

    .admin-dropdown.open{
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0);
    }

    .dropdown-item {
      padding: 9px 12px;
      font-size: 13px;
      color: #111827;
      text-decoration: none;
      white-space: nowrap;
    }

    .dropdown-item:hover { background: rgba(17,24,39,.06); }

    .dropdown-sep { height: 1px; background: rgba(17,24,39,.08); margin: 2px 0; }

    .dropdown-item.logout {
      color: #b91c1c;
      font-weight: 800;
    }

    /* ✅ main.jsp처럼 hover로도 열림 */
    .admin-area:hover .admin-dropdown{
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0);
    }

    /* ===============================
       ✅ PAGE CONTENT (기존 유지)
       =============================== */
    .wrap{
      max-width: 1150px;
      margin: 18px auto 80px;
      padding: 0 22px;
    }

    .page-title h1{
      margin: 0;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.2px;
      color: #111827;
    }

    .page-title p{
      margin: 6px 0 0;
      font-size: 13px;
      color: #8a94a6;
    }

    .pill-row{
      margin-top: 14px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .pill{
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      background: #f1f3f6;
      border: 1px solid #e3e7ee;
      font-size: 13px;
      font-weight: 700;
      color: #4b5563;
      user-select: none;
    }

    .pill .icon{
      width: 18px; height: 18px;
      display: grid; place-items: center;
      border-radius: 6px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      font-size: 12px;
    }

    .card{
      margin-top: 14px;
      background: #ffffff;
      border: 1px solid #e7ebf0;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 6px 18px rgba(17,24,39,.06);
    }

    .card h2{
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      color: #111827;
    }

    .card .sub{
      margin: 6px 0 0;
      font-size: 12px;
      color: #8a94a6;
    }

    .form{
      margin-top: 18px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px 18px;
    }

    .field label{
      display: block;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 700;
      color: #6b7280;
    }

    .field input{
      width: 100%;
      height: 44px;
      border-radius: 10px;
      border: 1px solid #eef1f5;
      color: #111827;
      padding: 0 14px;
      font-size: 14px;
      outline: none;
      background: #ffffff;
    }

    .field input[readonly]{
      background:#f3f4f6;
      color:#6b7280;
      cursor:not-allowed;
    }

    .field input:focus{
      border-color: #cfd6e3;
      box-shadow: 0 0 0 4px rgba(17,24,39,.06);
    }

    .actions{
      margin-top: 16px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
    }

    .btn{
      height: 38px;
      padding: 0 18px;
      border-radius: 8px;
      background: #0b0f14;
      border: 1px solid #0b0f14;
      color: #ffffff;
      font-weight: 800;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
    }

    .btn[disabled]{
      opacity: .55;
      cursor: not-allowed;
    }

    .msg {
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      color: #111827;
    }
    .msg.ok { border-color: #bbf7d0; background: #f0fdf4; }
    .msg.err { border-color: #fecaca; background: #fef2f2; color: #991b1b; }

    .verified-badge{
      margin-top: 8px;
      font-size: 12px;
      font-weight: 900;
      color: #16a34a;
    }

    .pw-mismatch{
      display:none;
      margin-top: 8px;
      font-size: 12px;
      font-weight: 900;
      color: #b91c1c;
    }

    /* ⚠️ main.jsp는 반응형에서 navbar를 세로로 바꾸지 않았으니
       "완전 동일"을 원하면 여기서 navbar 관련 반응형 변경은 제거하는 게 맞아.
       (아래는 content만 반응형 유지) */
    @media (max-width: 860px){
      .form{ grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <!-- ✅ NAVBAR (main.jsp와 동일 구조/값) -->
  <nav class="navbar">
    <a href="main.html" class="navbar-brand">💧 SMART WATER JP</a>

    <ul class="nav-links" id="navLinks">
      <li><a href="customer_list.html">顧客一覧</a></li>
      <li><a href="district.html">管轄区域管理</a></li>
      <li><a href="overdue_list.html">延滞管理</a></li>
      <li><a href="#">入金管理</a></li>
      <li><a href="billing_list.html">請求管理</a></li>
    </ul>

    <div class="admin-area" id="adminArea">
      <div class="admin-text">
        <div class="admin-name">管理者 デモ 様</div>
        <div class="admin-id">社員番号 A1001</div>
      </div>

      <div class="admin-icon">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M12 12c2.76 0 5-2.46 5-5.5S14.76 1 12 1 7 3.46 7 6.5 9.24 12 12 12Z"
                stroke="#111827" stroke-width="1.6"/>
          <path d="M3 23c0-4.2 4-7.6 9-7.6s9 3.4 9 7.6"
                stroke="#111827" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="admin-dropdown" id="adminDropdown">
        <a href="admin.html" class="dropdown-item">設定</a>
        <div class="dropdown-sep"></div>
        <a href="index.html" class="dropdown-item logout">ログアウト</a>
      </div>
    </div>
  </nav>

  <main class="wrap">
    <section class="page-title">
      <h1>設定</h1>
      <p>システム設定を管理してください</p>
    </section>

    <div class="pill-row">
      <div class="pill"><span class="icon">👤</span>プロフィール</div>
    </div>

    <section class="card">
      <h2>管理者情報</h2>
      <p class="sub">管理者アカウント情報を修正できます</p>

      
      

      <form method="post" action="admin.jsp" id="pwForm">
        <input type="hidden" name="oldId" value="A1001" />
        <input type="hidden" name="action" id="actionField" value="" />

        <div class="form">
          <div class="field">
            <label>氏名</label>
            <input type="text" value="管理者 デモ" readonly />
          </div>

          <div class="field">
            <label>社員番号</label>
            <input type="text" value="A1001" readonly />
          </div>

          <div class="field" id="maskedBox">
            <label>パスワード</label>
            <div style="display:flex; gap:10px; align-items:center;">
              <input type="text" value="**************" readonly />
              <button class="btn" type="button" id="btnChange" style="height:44px;">変更</button>
            </div>
          </div>

          <div class="field" id="verifyBox" style="display:none;">
            <label>現在のパスワード</label>
            <div style="display:flex; gap:10px; align-items:center;">
              <input type="password" name="currentPassword" id="currentPw"
                     placeholder="現在のパスワード" autocomplete="current-password" />
              <button class="btn" type="button" id="btnVerify" style="height:44px;">確認</button>
            </div>
            <div class="verified-badge" id="verifiedBadge" style="display:none;">認証完了</div>
          </div>

          <div id="newPwBox" style="display:none;">
            <div class="field">
              <label>新しいパスワード</label>
              <input type="password" name="newPassword" id="newPw"
                     placeholder="新しいパスワード" autocomplete="new-password" />
            </div>

            <div class="field">
              <label>新しいパスワード（確認）</label>
              <input type="password" name="confirmPassword" id="confirmPw"
                     placeholder="もう一度入力" autocomplete="new-password" />
              <div id="pwMismatchMsg" class="pw-mismatch">新しいパスワードが一致しません。</div>
            </div>
          </div>
        </div>

        <div class="actions" id="saveBox" style="display:none;">
          <button class="btn" type="submit" id="btnSave">保存</button>
        </div>
      </form>
    </section>
  </main>

  <script>
    // ✅ ADMIN DROPDOWN (click to toggle) - main.jsp 동일
    const adminArea = document.getElementById("adminArea");
    const adminDropdown = document.getElementById("adminDropdown");

    adminArea.addEventListener("click", function (e) {
      e.stopPropagation();
      adminDropdown.classList.toggle("open");
    });

    adminDropdown.addEventListener("click", function (e) {
      e.stopPropagation();
    });

    document.addEventListener("click", function () {
      adminDropdown.classList.remove("open");
    });

    // ============================
    // ✅ Password Flow UI
    // ============================
    const pwForm = document.getElementById("pwForm");
    const actionField = document.getElementById("actionField");

    const btnChange = document.getElementById("btnChange");
    const verifyBox = document.getElementById("verifyBox");
    const btnVerify = document.getElementById("btnVerify");

    const verifiedBadge = document.getElementById("verifiedBadge");

    const newPwBox = document.getElementById("newPwBox");
    const saveBox = document.getElementById("saveBox");
    const newPw = document.getElementById("newPw");
    const confirmPw = document.getElementById("confirmPw");
    const btnSave = document.getElementById("btnSave");

    const pwMismatchMsg = document.getElementById("pwMismatchMsg");

    btnChange.addEventListener("click", () => {
      verifyBox.style.display = "block";
      btnVerify.textContent = "確認";
      btnVerify.disabled = false;
      verifiedBadge.style.display = "none";
      document.getElementById("currentPw").focus();
    });

    btnVerify.addEventListener("click", () => {
      actionField.value = "verify";
      pwForm.submit();
    });

    function validateNewPasswords() {
      if (!newPwBox || newPwBox.style.display === "none") return;

      const a = (newPw?.value || "").trim();
      const b = (confirmPw?.value || "").trim();

      if (a === "" || b === "") {
        if (pwMismatchMsg) pwMismatchMsg.style.display = "none";
        if (btnSave) btnSave.disabled = true;
        return;
      }

      if (a !== b) {
        if (pwMismatchMsg) pwMismatchMsg.style.display = "block";
        if (btnSave) btnSave.disabled = true;
      } else {
        if (pwMismatchMsg) pwMismatchMsg.style.display = "none";
        if (btnSave) btnSave.disabled = false;
      }
    }

    if (newPw) newPw.addEventListener("input", validateNewPasswords);
    if (confirmPw) confirmPw.addEventListener("input", validateNewPasswords);

    btnSave.addEventListener("click", (e) => {
      validateNewPasswords();
      if (btnSave.disabled) {
        e.preventDefault();
        return;
      }
      actionField.value = "save";
    });

    const pwVerified = false;
    if (pwVerified) {
      verifyBox.style.display = "block";
      verifiedBadge.style.display = "block";
      btnVerify.textContent = "認証完了";
      btnVerify.disabled = true;

      newPwBox.style.display = "block";
      saveBox.style.display = "flex";

      if (newPw) newPw.focus();
      if (btnSave) btnSave.disabled = true;

      validateNewPasswords();
    }
  </script>
<div style="position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#1f2d3d;color:#fff;font:13px/1.5 sans-serif;text-align:center;padding:8px 12px">정적 데모 · 로컬 실행 화면을 저장한 것이라 검색 · 입금 처리 등 서버 기능은 동작하지 않아요 · 데이터는 데모 값 · <a href="https://0613yunseo.github.io/#projects" style="color:#9fd0ff">포트폴리오로 돌아가기</a></div><script>window.openPaymentPopup=function(){alert('デモ用の静的ページのため、この操作は利用できません。')};document.querySelectorAll('form').forEach(function(f){if(f.id!=='loginForm'){f.addEventListener('submit',function(e){e.preventDefault();var st=f.querySelector('select[name=status]');if(st){location.href='deposit__status_'+(st.value==='all'?'all':st.value)+'_page_1.html';return}alert('デモ用の静的ページのため、この操作は利用できません。')})}});</script></body>
</html>
